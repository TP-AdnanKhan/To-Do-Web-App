<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>TODO WEB APP</title>
    <link rel="stylesheet" href="to-do3.css" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Roboto&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>

    <header class="outermost">
      <div class="outer1">
        <h1>TODO LIST</h1>

        <nav>
          <div class="search-div">
            <i class="fa fa-search"></i>
            <input type="text" id="searchbar" placeholder="Search here..." />
          </div>
          <select name="status" class="status">
            <option value="all">All</option>
            <option value="complete">Complete</option>
            <option value="incomplete">Incomplete</option>
          </select>
          <button class="cg-mode ">
            <i class="fa-notdog fa-solid fa-sun"></i>
          </button>
        </nav>
      </div>
    </header>

    <main class="outer2">
      <div class="maindiv">

        <div class="hidden-one">
        <label class="check-label">
          <input type="checkbox" class="progress" />
          <span class="task-description">Hidden !poof!</span>
        </label>
        <span class="editspan">
          <button class="edit-task edt"><i class="fa-solid fa-pencil"></i></button>
          <button class="edit-task del"><i class="fa-solid fa-trash"></i></button
        ></span>
      </div>

        <div class="task-row">
        <label class="check-label">
          <input type="checkbox" class="progress" />
          <span class="task-description unchecked">Hello1aaaaaaaaaaaaaaaaaaaaaa</span>
        </label>
        <span class="editspan">
          <button class="edit-task edt"><i class="fa-solid fa-pencil"></i></button>
          <button class="edit-task del"><i class="fa-solid fa-trash"></i></button
        ></span>
      </div>
        <hr class="ruler">

        <div class="task-row">
        <label class="check-label">
          <input type="checkbox" class="progress" />
          <span class="task-description unchecked">Hello1bbbbbaaaaaaaa</span>
        </label>
        <span class="editspan">
          <button class="edit-task edt"><i class="fa-solid fa-pencil"></i></button>
          <button class="edit-task del"><i class="fa-solid fa-trash"></i></button
        ></span>
        </div>
        <hr class="ruler">

        <button class="addNote"><i class="fa-solid fa-plus"></i></button>
      </div>
    </main>
    <script src="to-do3.js"></script>
  </body>
</html>
