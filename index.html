<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>To-Do App</title>
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"
    />
    <link rel="stylesheet" href="to-do.css" />
  </head>
  <body>
    <div class="container">
      <h1>TO DO LIST</h1>
      <div class="searchbar">
        <input type="text" placeholder="Title goes here" id="search" />
        <select class="filter">
          <option value="all">ALL</option>
          <option value="active">ACTIVE</option>
          <option value="completed">COMPLETED</option>
        </select>

        <button class="mode dark">
          <i class="fa-solid fa-moon"></i>
        </button>
        <button class="mode light hide">
          <i class="fa-solid fa-sun"></i>
        </button>
      </div>

      <!-- <i class="fa-solid fa-plus"></i> -->
    </div>
<!-- ------------------------------------start of item------------------------------------------ -->
    <div class="item easter-egg">
      <!-- hidden item to help append new items -->
      <span class="tickStatus">
        <button class="tickbox notick">
          <i class="fa-regular fa-square"></i>
        </button>
        <button class="tickbox tick hide">
          <i class="fa-solid fa-square-check"></i></button
      ></span>

      <span class="text">Easter EGG</span>

      <span class="edbtn">
        <button class="edit"><i class="fa-solid fa-pencil"></i></button>
        <button class="trash"><i class="fa-solid fa-trash"></i></button>
      </span>
    </div>
<!-- -------------------------------------End of item------------------------------------------------->

    <div class="inputInfo hide">
      <input type="text" id="inputText" placeholder="Enter text here..." />
      <button class="confirm">Confirm</button>
    </div>

    <div class="editInfo hide">
      <input type="text" id="inputEdited" placeholder="Modify the task" />
      <button class="confirmModification">Confirm</button>
    </div>
    <button class="create"><i class="fa-solid fa-plus"></i></button>

    <script src="to-do.js"></script>
  </body>
</html>
